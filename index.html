<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOMINIQUE KAMDEM - Adaptive Beat Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #02040a;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Fullscreen Background Slideshow */
    .bg-slideshow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
    }

    .bg-slideshow img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      filter: brightness(0.55) contrast(1.1);
      transform: scale(1);
      transition: opacity 0.35s cubic-bezier(0.25, 1, 0.5, 1), transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .bg-slideshow img.active {
      opacity: 1;
      transform: scale(1.05);
    }

    /* Dynamic Beat Punch Snap */
    .bg-slideshow img.beat-snap {
      animation: snapZoom 0.2s cubic-bezier(0, 0.9, 0.1, 1) forwards;
    }

    @keyframes snapZoom {
      0% { transform: scale(1.18); filter: brightness(0.85) contrast(1.3); }
      100% { transform: scale(1.05); filter: brightness(0.55) contrast(1.1); }
    }

    /* Flash Overlay for High Energy Beats */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: white;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.05s ease-out;
    }

    /* Interactive Particle Canvas */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    /* Main Non-Overlapping Container Stack */
    .container {
      position: relative;
      text-align: center;
      z-index: 3;
      width: 100%;
      padding: 0 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .controls-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    input[type="file"] {
      display: none;
    }

    .custom-file-upload {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      transition: background 0.2s, transform 0.1s;
    }

    .custom-file-upload:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.03);
    }

    audio {
      filter: invert(0.9) hue-rotate(180deg);
      opacity: 0.85;
      width: 100%;
      max-width: 320px;
    }

    /* Animated Frequency Title Text */
    #wave-text {
      font-size: clamp(1.2rem, 5vw, 3.5rem);
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.15rem;
      margin-top: 10px;
    }

    #wave-text span {
      display: inline-block;
      will-change: transform, color, text-shadow;
      transition: transform 0.02s linear, color 0.02s linear;
    }

    #wave-text span.space {
      width: 0.6em;
    }
  </style>
</head>
<body>

  <div class="bg-slideshow" id="slideshow-container">
    <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1200" class="active" alt="Default Image 1">
    <img src="https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=1200" alt="Default Image 2">
  </div>

  <div id="flash-overlay"></div>
  <canvas id="particle-canvas"></canvas>

  <div class="container">
    <div class="controls-wrapper">
      <label for="image-file" class="custom-file-upload">
        🖼️ Upload Photos
      </label>
      <input type="file" id="image-file" accept="image/*" multiple>

      <label for="audio-file" class="custom-file-upload">
        🎵 Choose MP3
      </label>
      <input type="file" id="audio-file" accept="audio/*">
    </div>

    <audio id="audio" controls crossorigin="anonymous"></audio>

    <div id="wave-text">
      <span>D</span><span>O</span><span>M</span><span>I</span><span>N</span><span>I</span><span>Q</span><span>U</span><span>E</span>
      <span class="space">&nbsp;</span>
      <span>K</span><span>A</span><span>M</span><span>D</span><span>E</span><span>M</span>
    </div>
  </div>

  <script>
    const audioElement = document.getElementById('audio');
    const audioFileInput = document.getElementById('audio-file');
    const imageFileInput = document.getElementById('image-file');
    const slideshowContainer = document.getElementById('slideshow-container');
    const letters = document.querySelectorAll('#wave-text span:not(.space)');
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    const flashOverlay = document.getElementById('flash-overlay');

    let slides = document.querySelectorAll('.bg-slideshow img');
    let currentSlide = 0;
    let baseHue = 0;
    let particles = [];

    // Web Audio Engine
    let audioCtx, analyser, source, freqData;
    let isAudioSetup = false;

    // Adaptive Tempo Engine Variables
    let energyBuffer = [];
    const BUFFER_SIZE = 45;
    let beatIntervals = [];
    let adaptiveInterval = 2000; // Fallback interval
    let lastBeatTime = 0;
    let lastTransitionTime = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function setupWebAudio() {
      if (isAudioSetup) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.3;

        source = audioCtx.createMediaElementSource(audioElement);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);

        freqData = new Uint8Array(analyser.frequencyBinCount);
        isAudioSetup = true;
      } catch (e) {
        console.warn("Audio Context initialized error:", e);
      }
    }

    function triggerNextSlide(hue) {
      if (slides.length === 0) return;

      slides[currentSlide].classList.remove('active', 'beat-snap');
      currentSlide = (currentSlide + 1) % slides.length;

      const activeSlide = slides[currentSlide];
      void activeSlide.offsetWidth; // Trigger reflow for animation restart
      activeSlide.classList.add('active', 'beat-snap');

      flashOverlay.style.background = `hsla(${hue}, 100%, 80%, 0.25)`;
      flashOverlay.style.opacity = '1';
      setTimeout(() => { flashOverlay.style.opacity = '0'; }, 60);
    }

    imageFileInput.addEventListener('change', function() {
      const files = this.files;
      if (files.length === 0) return;

      slideshowContainer.innerHTML = '';
      currentSlide = 0;

      Array.from(files).forEach((file, idx) => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        if (idx === 0) img.classList.add('active');
        slideshowContainer.appendChild(img);
      });

      slides = document.querySelectorAll('.bg-slideshow img');
    });

    audioFileInput.addEventListener('change', function() {
      if (this.files.length > 0) {
        audioElement.src = URL.createObjectURL(this.files[0]);
        audioElement.play();
      }
    });

    audioElement.addEventListener('play', () => {
      setupWebAudio();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      renderLoop();
    });

    class Particle {
      constructor(x, y, hue) {
        this.x = x + (Math.random() - 0.5) * 12;
        this.y = y;
        this.size = Math.random() * 2.5 + 1;
        this.speedY = Math.random() * 2.5 + 1.5;
        this.speedX = (Math.random() - 0.5) * 1.2;
        this.hue = hue;
        this.opacity = 1;
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.opacity -= 0.022;
      }

      draw() {
        ctx.fillStyle = `hsla(${this.hue}, 100%, 75%, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function renderLoop() {
      if (audioElement.paused) return;

      const now = performance.now();
      baseHue = (baseHue + 0.8) % 360;

      let currentBassEnergy = 0;

      if (isAudioSetup && analyser && freqData) {
        analyser.getByteFrequencyData(freqData);

        // Low frequency spectrum analysis
        currentBassEnergy = (freqData[0] + freqData[1] + freqData[2] + freqData[3] + freqData[4]) / 5;

        // Calculate average background energy dynamically
        const avgEnergy = energyBuffer.length > 0 
          ? energyBuffer.reduce((a, b) => a + b, 0) / energyBuffer.length 
          : 100;

        const dynamicThreshold = Math.max(70, avgEnergy * 1.25);

        // Transient Hit Detection Logic
        if (currentBassEnergy > dynamicThreshold && (now - lastBeatTime > 220)) {
          const delta = now - lastBeatTime;
          lastBeatTime = now;

          if (delta < 2000) {
            beatIntervals.push(delta);
            if (beatIntervals.length > 8) beatIntervals.shift();

            const avgInterval = beatIntervals.reduce((a, b) => a + b, 0) / beatIntervals.length;
            adaptiveInterval = avgInterval > 600 ? avgInterval * 2 : avgInterval * 4;
          }
        }

        energyBuffer.push(currentBassEnergy);
        if (energyBuffer.length > BUFFER_SIZE) energyBuffer.shift();
      }

      // Check adaptive interval timer
      if (now - lastTransitionTime >= adaptiveInterval) {
        triggerNextSlide(baseHue);
        lastTransitionTime = now;
      }

      // Clear & redraw canvas frame
      ctx.fillStyle = 'rgba(2, 4, 10, 0.22)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Render letter wave spectrum & particle generation
      letters.forEach((letter, index) => {
        let intensity = 0.2;

        if (isAudioSetup && freqData) {
          const binIndex = Math.floor((index / letters.length) * (freqData.length / 2));
          intensity = (freqData[binIndex] || 0) / 255;
        } else {
          intensity = (Math.sin(now * 0.004 + index * 0.5) + 1) / 2;
        }

        const letterHue = (baseHue + index * 14 + intensity * 40) % 360;
        const translateY = intensity * -38;
        const baseColor = `hsl(${letterHue}, 100%, 75%)`;

        letter.style.transform = `translateY(${translateY}px) scale(${1 + intensity * 0.15})`;
        letter.style.color = baseColor;
        letter.style.textShadow = `0 0 ${10 + intensity * 20}px ${baseColor}`;

        if (intensity > 0.3) {
          const rect = letter.getBoundingClientRect();
          for (let i = 0; i < Math.floor(intensity * 2); i++) {
            particles.push(new Particle(rect.left + rect.width / 2, rect.bottom, letterHue));
          }
        }
      });

      // Update particle physics
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].opacity <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(renderLoop);
    }
  </script>
</body>
</html>

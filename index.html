<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOMINIQUE KAMDEM - Fast Beat Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #02040a;
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      perspective: 1000px;
    }

    /* CapCut Image Layer */
    .bg-slideshow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
    }

    .bg-slideshow img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      filter: brightness(0.5) contrast(1.1);
      transform: scale(1);
      /* FAST TRANSITION: Changed from 0.3s to 0.05s for instant hard cuts */
      transition: opacity 0.05s ease-out;
    }

    .bg-slideshow img.active {
      opacity: 1;
      transform: scale(1.05);
    }

    /* Ultra-Fast Punch Zoom on Beat Hits */
    .bg-slideshow img.beat-punch {
      animation: capcutPunch 0.12s cubic-bezier(0, 0.9, 0.1, 1) forwards;
    }

    @keyframes capcutPunch {
      0% { transform: scale(1.3) rotate(-2deg); filter: brightness(1) contrast(1.5); }
      100% { transform: scale(1.05) rotate(0deg); filter: brightness(0.5) contrast(1.1); }
    }

    /* Strobe Flash Overlay */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: white;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.03s ease-out;
    }

    /* Particle Canvas */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }

    /* Text & Controls Container */
    .container {
      position: relative;
      text-align: center;
      z-index: 3;
      width: 100%;
      padding: 0 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .controls-wrapper {
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    input[type="file"] {
      display: none;
    }

    .custom-file-upload {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      backdrop-filter: blur(5px);
      transition: background 0.2s, transform 0.1s;
    }

    .custom-file-upload:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.03);
    }

    audio {
      filter: invert(0.9) hue-rotate(180deg);
      opacity: 0.8;
      max-width: 90%;
    }

    #wave-text {
      font-size: clamp(1.4rem, 5.5vw, 4.5rem);
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.15rem;
      width: 100%;
      transform: rotateX(10deg);
      transform-style: preserve-3d;
      position: relative;
    }

    #wave-text span {
      display: inline-block;
      will-change: transform, color, text-shadow;
      transition: transform 0.02s linear, color 0.02s linear;
    }

    #wave-text span.space {
      width: 0.8em;
    }
  </style>
</head>
<body>

  <!-- Background Slideshow -->
  <div class="bg-slideshow">
    <img src="img1.jpg" id="slide-0" class="active" alt="Edit 1">
    <img src="img2.jpg" id="slide-1" alt="Edit 2">
    <img src="img3.jpg" id="slide-2" alt="Edit 3">
    <img src="img4.jpg" id="slide-3" alt="Edit 4">
    <img src="img5.jpg" id="slide-4" alt="Edit 5">
  </div>

  <div id="flash-overlay"></div>
  <canvas id="particle-canvas"></canvas>

  <div class="container">
    <div class="controls-wrapper">
      <label for="audio-file" class="custom-file-upload">
        🎵 Choose MP3 File
      </label>
      <input type="file" id="audio-file" accept="audio/*">
      <audio id="audio" controls src="song.mp3"></audio>
    </div>

    <div id="wave-text">
      <span>D</span><span>O</span><span>M</span><span>I</span><span>N</span><span>I</span><span>Q</span><span>U</span><span>E</span>
      <span class="space">&nbsp;</span>
      <span>K</span><span>A</span><span>M</span><span>D</span><span>E</span><span>M</span>
    </div>
  </div>

  <script>
    const audioElement = document.getElementById('audio');
    const audioFileInput = document.getElementById('audio-file');
    const letters = document.querySelectorAll('#wave-text span:not(.space)');
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    const flashOverlay = document.getElementById('flash-overlay');
    const slides = document.querySelectorAll('.bg-slideshow img');

    let audioContext, analyser, source, dataArray;
    let isInitialized = false;
    let particles = [];
    let currentSlide = 0;
    let lastBeatTime = 0;
    let baseHue = 0;
    let previousEnergy = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    audioFileInput.addEventListener('change', function() {
      const files = this.files;
      if (files.length === 0) return;
      const file = files[0];
      audioElement.src = URL.createObjectURL(file);
      audioElement.play();
    });

    class Particle {
      constructor(x, y, hue) {
        this.x = x + (Math.random() - 0.5) * 15;
        this.y = y;
        this.size = Math.random() * 2.5 + 1;
        this.speedY = Math.random() * 3 + 2;
        this.speedX = (Math.random() - 0.5) * 1.5;
        this.hue = hue;
        this.opacity = 1;
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.opacity -= 0.025;
      }

      draw() {
        ctx.fillStyle = `hsla(${this.hue}, 100%, 75%, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function switchSlide(hue) {
      slides[currentSlide].classList.remove('active', 'beat-punch');

      currentSlide = (currentSlide + 1) % slides.length;

      const nextSlide = slides[currentSlide];
      void nextSlide.offsetWidth; 
      nextSlide.classList.add('active', 'beat-punch');

      flashOverlay.style.background = `hsla(${hue}, 100%, 90%, 0.4)`;
      flashOverlay.style.opacity = '1';
      setTimeout(() => { flashOverlay.style.opacity = '0'; }, 30);
    }

    audioElement.addEventListener('play', () => {
      if (!isInitialized) {
        setupAudioContext();
        isInitialized = true;
      }
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
      renderFrame();
    });

    function setupAudioContext() {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 64;
        analyser.smoothingTimeConstant = 0.1; // Reduced from 0.3 to 0.1 for maximum raw reactivity

        source = audioContext.createMediaElementSource(audioElement);
        source.connect(analyser);
        analyser.connect(audioContext.destination);

        dataArray = new Uint8Array(analyser.frequencyBinCount);
      } catch (e) {
        console.warn("Audio Context initialized:", e);
      }
    }

    function renderFrame() {
      if (audioElement.paused) return;

      baseHue = (baseHue + 1) % 360;
      const now = Date.now();

      let isBeat = false;

      if (analyser && dataArray) {
        analyser.getByteFrequencyData(dataArray);
        
        // Low spectrum bass energy calculation
        const currentEnergy = (dataArray[0] + dataArray[1] + dataArray[2]) / 3;
        
        // Lower threshold for fast triggers
        const energyDelta = currentEnergy - previousEnergy;
        
        if (energyDelta > 15 && currentEnergy > 80) {
          isBeat = true;
        }

        previousEnergy = currentEnergy;
      }

      // REDUCED COOLDOWN BUFFER: Changed from 120ms to 60ms to allow hyper-fast rapid edits
      if (isBeat && (now - lastBeatTime > 60)) {
        switchSlide(baseHue);
        lastBeatTime = now;
      }

      ctx.fillStyle = 'rgba(2, 4, 10, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      letters.forEach((letter, index) => {
        let intensity = 0.2;

        if (analyser && dataArray) {
          const binIndex = Math.floor((index / letters.length) * (dataArray.length / 2));
          const frequencyValue = dataArray[binIndex] || 0;
          intensity = frequencyValue / 255;
        }

        const letterHue = (baseHue + index * 12 + intensity * 60) % 360;
        const translateY = intensity * -45;
        const baseColor = `hsl(${letterHue}, 100%, 75%)`;

        letter.style.transform = `translateY(${translateY}px) scale(${1 + intensity * 0.2})`;
        letter.style.color = baseColor;
        letter.style.textShadow = `
          0 0 ${10 + intensity * 20}px ${baseColor},
          0 0 ${25 + intensity * 35}px hsl(${letterHue}, 100%, 50%)
        `;

        if (intensity > 0.15) {
          const rect = letter.getBoundingClientRect();
          const spawnX = rect.left + rect.width / 2;
          const spawnY = rect.bottom;

          for (let i = 0; i < Math.floor(intensity * 3); i++) {
            particles.push(new Particle(spawnX, spawnY, letterHue));
          }
        }
      });

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].opacity <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(renderFrame);
    }
  </script>
</body>
</html>

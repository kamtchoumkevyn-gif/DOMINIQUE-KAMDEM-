<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dominique Kamdem — Visualizer</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#02040a;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }

  #slideshow{position:fixed;inset:0;z-index:1;background:#02040a;overflow:hidden;}
  .photo-layer{
    position:absolute;inset:0;
    background-size:cover;background-position:center;background-repeat:no-repeat;
    opacity:0;
    transform-origin:center center;
    will-change:opacity, transform, filter;
  }
  .photo-layer.beat-snap{ animation: beatPunch 260ms ease-out; }
  @keyframes beatPunch{
    0%{ filter:brightness(1) saturate(1); transform:scale(1);}
    35%{ filter:brightness(1.45) saturate(1.3); transform:scale(1.045);}
    100%{ filter:brightness(1) saturate(1); transform:scale(1);}
  }

  #flashOverlay{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(circle at 50% 40%, rgba(255,255,255,0.55), rgba(125,211,252,0.15) 45%, transparent 70%);
    opacity:0;
    mix-blend-mode:screen;
  }

  #particleCanvas{position:fixed;inset:0;z-index:4;pointer-events:none;}

  .ui{
    position:relative;z-index:10;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;
    padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
  }

  .controls{
    display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%;
  }
  .glass-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.18);
    color:#f5f7ff;font-size:14px;font-weight:600;
    padding:12px 18px;border-radius:16px;
    cursor:pointer;user-select:none;
    box-shadow:0 4px 18px rgba(0,0,0,0.35);
    transition:transform 150ms ease, background 150ms ease, box-shadow 150ms ease;
  }
  .glass-btn:active{transform:scale(0.95);background:rgba(255,255,255,0.16);}
  input[type="file"]{display:none;}

  .title-wrap{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:92%;max-width:900px;
    text-align:center;z-index:3;
    pointer-events:none;
  }
  #titleText{
    display:flex;flex-wrap:wrap;justify-content:center;
    font-weight:800;letter-spacing:2px;
    font-size:clamp(22px, 7vw, 56px);
    line-height:1.1;
  }
  #titleText span{
    display:inline-block;
    color:#e8ecff;
    text-shadow:0 0 12px rgba(125,211,252,0.25);
    will-change:transform, color, text-shadow;
  }

  .hint{
    color:rgba(255,255,255,0.55);
    font-size:13px;text-align:center;
    max-width:280px;margin:10px auto 0;
  }

  .bottom-bar{
    display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;
  }
  audio{
    width:min(92vw, 420px);
    filter:invert(1) hue-rotate(180deg) brightness(1.05) contrast(1.05);
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .file-name{
    color:rgba(255,255,255,0.5);font-size:11px;max-width:80vw;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
</style>
</head>
<body>

<div id="slideshow">
  <div class="photo-layer" id="layerA"></div>
  <div class="photo-layer" id="layerB"></div>
</div>
<div id="flashOverlay"></div>
<canvas id="particleCanvas"></canvas>

<div class="ui">
  <div class="controls">
    <label class="glass-btn" for="photoInput">🖼️ Upload Photos</label>
    <input type="file" id="photoInput" accept="image/*" multiple>
    <label class="glass-btn" for="audioInput">🎵 Choose MP3</label>
    <input type="file" id="audioInput" accept="audio/*">
  </div>

  <div class="title-wrap">
    <div id="titleText"></div>
    <div class="hint" id="hint">Upload photos and choose a track to begin</div>
  </div>

  <div class="bottom-bar">
    <div class="file-name" id="fileName"></div>
    <audio id="audioPlayer" controls></audio>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ---------- DOM references ----------
  const photoInput   = document.getElementById('photoInput');
  const audioInput   = document.getElementById('audioInput');
  const audioPlayer  = document.getElementById('audioPlayer');
  const layerA       = document.getElementById('layerA');
  const layerB       = document.getElementById('layerB');
  const flashOverlay = document.getElementById('flashOverlay');
  const canvas       = document.getElementById('particleCanvas');
  const ctx          = canvas.getContext('2d');
  const titleTextEl  = document.getElementById('titleText');
  const hintEl       = document.getElementById('hint');
  const fileNameEl   = document.getElementById('fileName');

  // ---------- Build title letters ----------
  const TITLE = "DOMINIQUE KAMDEM";
  const letterEls = [];
  TITLE.split('').forEach((ch) => {
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0\u00A0' : ch;
    titleTextEl.appendChild(span);
    letterEls.push(span);
  });

  // ---------- Canvas sizing ----------
  function resizeCanvas(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = window.innerWidth  * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width  = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ---------- Slideshow state ----------
  let photos = [];
  let currentIndex = 0;
  let nextIndex = 0;
  let transitioning = false;
  let transitionStart = 0;
  const TRANSITION_MS = 900;
  const SLIDE_INTERVAL_MS = 3000;
  let slideTimer = 0;
  let frontLayerIsA = true;

  function setLayerImage(layerEl, url){
    layerEl.style.backgroundImage = url ? `url("${url}")` : 'none';
  }

  function initSlideshow(){
    if(photos.length === 0) return;
    currentIndex = 0;
    nextIndex = photos.length > 1 ? 1 : 0;
    frontLayerIsA = true;
    setLayerImage(layerA, photos[currentIndex]);
    layerA.style.opacity = 1;
    setLayerImage(layerB, photos.length > 1 ? photos[nextIndex] : photos[currentIndex]);
    layerB.style.opacity = 0;
    transitioning = false;
    slideTimer = 0;
  }

  photoInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    if(files.length === 0) return;
    photos.forEach(URL.revokeObjectURL);
    photos = files.map(f => URL.createObjectURL(f));
    initSlideshow();
    updateHint();
  });

  function beginTransition(){
    if(photos.length < 2){
      slideTimer = 0;
      return;
    }
    const backLayer = frontLayerIsA ? layerB : layerA;
    nextIndex = (currentIndex + 1) % photos.length;
    setLayerImage(backLayer, photos[nextIndex]);
    backLayer.style.opacity = 0;
    transitioning = true;
    transitionStart = performance.now();
  }

  function updateTransition(now){
    if(!transitioning) return;
    const t = Math.min(1, (now - transitionStart) / TRANSITION_MS);
    const frontLayer = frontLayerIsA ? layerA : layerB;
    const backLayer  = frontLayerIsA ? layerB : layerA;
    frontLayer.style.opacity = String(1 - t);
    backLayer.style.opacity  = String(t);
    if(t >= 1){
      transitioning = false;
      frontLayerIsA = !frontLayerIsA;
      currentIndex = nextIndex;
    }
  }

  function activeLayer(){
    return frontLayerIsA ? layerA : layerB;
  }

  // ---------- Audio file loading ----------
  audioInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const url = URL.createObjectURL(file);
    audioPlayer.src = url;
    audioPlayer.load();
    fileNameEl.textContent = file.name;
    updateHint();
  });

  // ---------- Web Audio API setup ----------
  let audioCtx = null;
  let analyser = null;
  let sourceNode = null;
  let dataArray = null;
  let bufferLength = 0;
  let audioReady = false;
  let isPlaying = false;

  function ensureAudioGraph(){
    if(audioReady) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
    sourceNode = audioCtx.createMediaElementSource(audioPlayer);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    audioReady = true;
  }

  audioPlayer.addEventListener('play', () => {
    ensureAudioGraph();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    isPlaying = true;
    lastFrameTime = performance.now();
  });
  audioPlayer.addEventListener('pause', () => { isPlaying = false; });
  audioPlayer.addEventListener('ended', () => { isPlaying = false; });

  function updateHint(){
    const hasPhotos = photos.length > 0;
    const hasAudio  = !!audioPlayer.src;
    if(hasPhotos && hasAudio){
      hintEl.style.display = 'none';
    } else {
      hintEl.style.display = 'block';
      hintEl.textContent = (!hasPhotos && !hasAudio)
        ? 'Upload photos and choose a track to begin'
        : (!hasPhotos ? 'Now add some photos' : 'Now choose a track');
    }
  }

  // ---------- Beat detection (adaptive threshold) ----------
  const bassHistory = [];
  const HISTORY_LEN = 45;
  let lastBeatTime = 0;
  const BEAT_COOLDOWN_MS = 150;
  const MIN_BASS_FLOOR = 26;

  function getBassEnergy(){
    let sum = 0;
    for(let i = 0; i <= 4; i++) sum += dataArray[i];
    return sum / 5;
  }

  function detectBeat(bass, now){
    bassHistory.push(bass);
    if(bassHistory.length > HISTORY_LEN) bassHistory.shift();
    const mean = bassHistory.reduce((a,b)=>a+b,0) / bassHistory.length;
    let variance = 0;
    for(const v of bassHistory) variance += (v - mean) * (v - mean);
    variance /= bassHistory.length;
    const stdDev = Math.sqrt(variance);
    const threshold = mean + stdDev * 1.4;
    if(bass > threshold && bass > MIN_BASS_FLOOR && (now - lastBeatTime) > BEAT_COOLDOWN_MS){
      lastBeatTime = now;
      return true;
    }
    return false;
  }

  function triggerBeatEffects(){
    const layer = activeLayer();
    layer.classList.remove('beat-snap');
    void layer.offsetWidth; // restart animation
    layer.classList.add('beat-snap');

    flashOverlay.style.transition = 'none';
    flashOverlay.style.opacity = '0.65';
    void flashOverlay.offsetWidth;
    flashOverlay.style.transition = 'opacity 220ms ease-out';
    flashOverlay.style.opacity = '0';
  }

  // ---------- Particle system ----------
  let particles = [];
  const letterCooldowns = new Array(letterEls.length).fill(0);
  const PARTICLE_THRESHOLD = 0.62;
  const LETTER_COOLDOWN_MS = 110;

  function spawnParticles(x, y, hue){
    const count = 2 + Math.floor(Math.random() * 3);
    for(let i = 0; i < count; i++){
      particles.push({
        x: x + (Math.random() * 16 - 8),
        y: y,
        vx: (Math.random() - 0.5) * 1.4,
        vy: Math.random() * 1.2 + 0.4,
        radius: Math.random() * 2.5 + 1.5,
        alpha: 1,
        hue: hue + (Math.random() * 30 - 15)
      });
    }
  }

  function updateParticles(){
    for(let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.vy += 0.045;
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.012;
      p.hue += 0.6;
      if(p.alpha <= 0 || p.y > window.innerHeight + 20){
        particles.splice(i, 1);
      }
    }
    if(particles.length > 600) particles.splice(0, particles.length - 600);
  }

  function drawParticles(){
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for(const p of particles){
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 90%, 65%, ${Math.max(0, p.alpha)})`;
      ctx.fill();
    }
  }

  // ---------- Spectrum-driven typography ----------
  function updateTitleSpectrum(now){
    const n = letterEls.length;
    for(let i = 0; i < n; i++){
      const el = letterEls[i];
      if(!analyser){
        el.style.transform = '';
        el.style.color = '#e8ecff';
        el.style.textShadow = '0 0 12px rgba(125,211,252,0.25)';
        continue;
      }
      const binIndex = Math.min(bufferLength - 1, Math.floor((i / n) * bufferLength * 0.6) + 2);
      const amp = dataArray[binIndex] / 255;
      const scale = 1 + amp * 0.55;
      const lift = -amp * 26;
      const hue = 195 + amp * 140;
      el.style.transform = `translateY(${lift}px) scale(${scale})`;
      el.style.color = `hsl(${hue}, 92%, ${62 + amp * 18}%)`;
      el.style.textShadow = `0 0 ${10 + amp * 22}px hsla(${hue}, 95%, 65%, ${0.35 + amp * 0.5})`;

      if(amp > PARTICLE_THRESHOLD && (now - letterCooldowns[i]) > LETTER_COOLDOWN_MS){
        letterCooldowns[i] = now;
        const rect = el.getBoundingClientRect();
        spawnParticles(rect.left + rect.width / 2, rect.bottom, hue);
      }
    }
  }

  // ---------- Main render loop ----------
  let lastFrameTime = performance.now();

  function animate(now){
    const dt = now - lastFrameTime;
    lastFrameTime = now;

    if(isPlaying && analyser){
      analyser.getByteFrequencyData(dataArray);

      const bass = getBassEnergy();
      if(detectBeat(bass, now)){
        triggerBeatEffects();
      }

      slideTimer += dt;
      if(!transitioning && slideTimer >= SLIDE_INTERVAL_MS && photos.length > 1){
        beginTransition();
        slideTimer = 0;
      }
      updateTransition(now);
    }

    updateTitleSpectrum(now);
    updateParticles();
    drawParticles();

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
  updateHint();

})();
</script>
</body>
</html>
